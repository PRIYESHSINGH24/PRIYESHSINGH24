<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Priyesh Singh - Full-Stack Developer, Java, AI/ML, Cloud and DevOps">
<title>Priyesh Singh</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#05060f"/><stop offset=".55" stop-color="#120a2e"/><stop offset="1" stop-color="#05060f"/>
  </linearGradient>
  <radialGradient id="horizon" cx="50%" cy="69%" r="55%">
